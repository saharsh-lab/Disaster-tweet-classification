name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Serving dependencies only (Flask + NumPy): the same footprint as the Vercel function
      - run: pip install -r requirements.txt
      - name: Vercel bundle is in sync with the repository root
        run: python scripts/sync_vercel_bundle.py --check
      - name: Unit and API tests
        run: python -m unittest discover -s tests -t . -v
